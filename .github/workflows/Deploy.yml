name: Build & Deploy Zulu-Jewels

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_URL: ""
  LATEST_URL: ""

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Create image name (Docker repository names must be lowercase)
      - name: Set image name
        id: image_info
        run: |
          IMAGE_TAG=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="${REGISTRY}/${IMAGE_NAME_LOWER}:${IMAGE_TAG}"
          LATEST_URL="${REGISTRY}/${IMAGE_NAME_LOWER}:latest"

          echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"
          echo "LATEST_URL=${LATEST_URL}" >> "$GITHUB_ENV"
          echo "image_url=${IMAGE_URL}" >> "$GITHUB_OUTPUT"
          echo "latest_url=${LATEST_URL}" >> "$GITHUB_OUTPUT"

      # 5. Build Docker image on GitHub
      #    IMPORTANT:
      #    The expensive Next.js build happens here,
      #    NOT on the DigitalOcean Droplet.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URL }}
            ${{ env.LATEST_URL }}

      # 6. Deploy the already-built image to CapRover
      - name: Deploy image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}
          image: ${{ env.IMAGE_URL }}
